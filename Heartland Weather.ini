; =================
; WIND ARROW — size = (wind mph * 2) + 10  (square PNG, no distortion)
; =================

[MeasureWindSpeedMph]
Measure=Calc
Group=OMParse
UpdateDivider=-1
Formula=([MeasureWindSpeedRaw_Index1] + 0)
DynamicVariables=1

[MeasureWindArrowSide]
Measure=Calc
Group=OMParse
UpdateDivider=-1
Formula=Round(([MeasureWindSpeedMph] * 2) + 10)
DynamicVariables=1

; =================
; WIND ARROW — pulse size between wind and gust
; These are animation tickers; keep UpdateDivider=1
; =================

[MeasureWindArrowPulse01]
Measure=Calc
UpdateDivider=1
Formula=(1 - cos((Counter / 15) * 2 * 3.141592653589793)) / 2
DynamicVariables=1

[MeasureWindArrowSidePulse]
Measure=Calc
UpdateDivider=1
; 1. Calculate base speed size
; 2. Add the "Pulse" (difference between speed and gust)
; 3. Multiply the whole result by GlobalScale
Formula=Round(((([MeasureWindSpeedMph] * #WindArrowScaleFactor#) + #WindArrowBaseSize#) + (((((([MeasureWindGustMph] + [MeasureWindSpeedMph] + abs([MeasureWindGustMph] - [MeasureWindSpeedMph])) / 2) * #WindArrowScaleFactor#) + #WindArrowBaseSize#) - (([MeasureWindSpeedMph] * #WindArrowScaleFactor#) + #WindArrowBaseSize#)) * [MeasureWindArrowPulse01])) * #WindArrowGlobalScale#)
;  Testing 45 mph - Comment out the real one
;Formula=(105 * #WindArrowGlobalScale#) 
;  Testing 0 mph - Comment out the real one
;Formula=(21 * #WindArrowGlobalScale#) 
DynamicVariables=1

[MeterWindArrow]
Meter=Image
Group=OM
UpdateDivider=1
X=270
Y=120
W=[MeasureWindArrowSidePulse]
H=[MeasureWindArrowSidePulse]
;OffsetX=([MeasureWindArrowSidePulse] / 2)
;OffsetY=([MeasureWindArrowSidePulse] / 2)
ImageName=#@#WeatherIcons\arrow.png
ImageRotate=([MeasureWindDir] - 90) % 360
; --- Added Tooltip ---
ToolTipText=Wind: [MeasureWindSpeed] mph#CRLF#Direction: [MeasureWindCardinal] ([MeasureWindDir][\x00B0])
DynamicVariables=1

; =================
; SUNRISE & SUNSET
; JSON-derived sunrise/sunset update only on OK fetch (OMParse + -1).
; Local time + is_day tick ~1/sec (OMTick + UpdateDivider=10).
; =================

; =================
; IS_DAY (LOCAL) — computed from local time vs today's sunrise/sunset
; Outputs 1=day, 0=night
; =================
[MeasureNowHour]
Measure=Time
Group=OMTick
UpdateDivider=10
Format=%H

[MeasureNowMin]
Measure=Time
Group=OMTick
UpdateDivider=10
Format=%M

[MeasureNowMinutes]
Measure=Calc
Group=OMTick
UpdateDivider=10
Formula=([MeasureNowHour]*60) + ([MeasureNowMin]*60/60)
DynamicVariables=1

[MeasureSunriseMinutes]
Measure=Calc
Group=OMParse
UpdateDivider=-1
Formula=([MeasureSunriseHour]*60) + [MeasureSunriseMin]
DynamicVariables=1

[MeasureSunsetMinutes]
Measure=Calc
Group=OMParse
UpdateDivider=-1
Formula=([MeasureSunsetHour]*60) + ([MeasureSunsetMin]*60/60)
DynamicVariables=1

[MeasureIsDay]
Measure=Calc
Group=OMTick
UpdateDivider=60
Formula=(( [MeasureNowMinutes] >= [MeasureSunriseMinutes] ) * ( [MeasureNowMinutes] < [MeasureSunsetMinutes] ))
DynamicVariables=1

[MeasureIsNight]
Measure=Calc
Group=OMTick
UpdateDivider=60
Formula=1 - ([MeasureIsDay] + 0)
DynamicVariables=1

