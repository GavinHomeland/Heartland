; =================
; BAROM DYNAMIC SIZE (counteract rotate shrink)
; baseW/H is the on-screen size at 0° rotation
; factor f(theta)=|cos|+|sin|, so at 45° => sqrt(2)
; keep center fixed by recomputing X/Y
; =================

[MeasureBaromBase]
Measure=Calc
Formula=60
DynamicVariables=1
UpdateDivider=-1

; --- ABS: degrees -> radians
[MeasureBaromAbsRad]
Measure=Calc
Formula=([MeasurePressureActualDeg] * 0.01745329252)
DynamicVariables=1
UpdateDivider=-1

; --- ABS: scale factor = |cos| + |sin|
[MeasureBaromAbsFactor]
Measure=Calc
Formula=(Abs(Cos([MeasureBaromAbsRad])) + Abs(Sin([MeasureBaromAbsRad])))
DynamicVariables=1
UpdateDivider=-1

; --- ABS: dynamic W/H
[MeasureBaromAbsWH]
Measure=Calc
Formula=Round([MeasureBaromBase] * [MeasureBaromAbsFactor])
DynamicVariables=1
UpdateDivider=-1

; --- ABS: fixed center derived from your current X/Y and base size
[MeasureBaromAbsCX]
Measure=Calc
Formula=([MeasureDialRowX] + ([MeasureBaromBase]/2))
DynamicVariables=1
UpdateDivider=-1

[MeasureBaromAbsCY]
Measure=Calc
Formula=[MeasureDialRowY] + ([MeasureBaromBase]/2)
DynamicVariables=1
UpdateDivider=-1

; --- ABS: dynamic X/Y (keep center fixed)
[MeasureBaromAbsX]
Measure=Calc
Formula=Round([MeasureBaromAbsCX] - ([MeasureBaromAbsWH] / 2))
DynamicVariables=1
UpdateDivider=-1

[MeasureBaromAbsY]
Measure=Calc
Formula=Round([MeasureBaromAbsCY] - ([MeasureBaromAbsWH] / 2))
DynamicVariables=1
UpdateDivider=-1

; --- TREND: degrees -> radians
[MeasureBaromTrendRad]
Measure=Calc
Formula=([MeasurePressureTrendDeg] * 0.01745329252)
DynamicVariables=1
UpdateDivider=-1

; --- TREND: scale factor
[MeasureBaromTrendFactor]
Measure=Calc
Formula=(Abs(Cos([MeasureBaromTrendRad])) + Abs(Sin([MeasureBaromTrendRad])))
DynamicVariables=1
UpdateDivider=-1

; --- TREND: dynamic W/H
[MeasureBaromTrendWH]
Measure=Calc
Formula=Round([MeasureBaromBase] * [MeasureBaromTrendFactor])
DynamicVariables=1
UpdateDivider=-1

; --- TREND: fixed center from your current X/Y and base size
[MeasureBaromTrendCX]
Measure=Calc
Formula=([MeasureDialRowX] + [MeasureDialSpacing] + ([MeasureBaromBase]/2))
DynamicVariables=1
UpdateDivider=-1

[MeasureBaromTrendCY]
Measure=Calc
Formula=[MeasureDialRowY] + ([MeasureBaromBase]/2)
DynamicVariables=1
UpdateDivider=-1

; --- TREND: dynamic X/Y
[MeasureBaromTrendX]
Measure=Calc
Formula=Round([MeasureBaromTrendCX] - ([MeasureBaromTrendWH] / 2))
DynamicVariables=1
UpdateDivider=-1

[MeasureBaromTrendY]
Measure=Calc
Formula=Round([MeasureBaromTrendCY] - ([MeasureBaromTrendWH] / 2))
DynamicVariables=1
UpdateDivider=-1

[MeasurePressureGauges]
Measure=Script
Group=OMParse
ScriptFile=#@#Lua\PressureGauges.lua
UpdateDivider=-1
DynamicVariables=1

; =================
; ABSOLUTE PRESSURE (ImageRotate, degrees)
; Needle art is drawn pointing straight up at 0°.
; M = normal median pressure (inHg).
; -90° corresponds to (M - 2.00 inHg)
; +90° corresponds to (M + 2.00 inHg)
; =================
[MeasurePressureMedianInHg]
Measure=Calc
Group=OMParse
Formula=29.92
UpdateDivider=-1

; Degrees: clamp to [-90, +90]
[MeasurePressureActualDeg]
Measure=Calc
Group=OMParse
Formula=Clamp((([MeasurePressureInHg] - [MeasurePressureMedianInHg]) / 2.0) * 90, -90, 90)
DynamicVariables=1
UpdateDivider=-1

[MeterBaromAbs]
Meter=Image
Group=OM
UpdateDivider=-1
X=#DialStartX#
Y=#DialStartY#
W=#DialBaseSize#
H=#DialBaseSize#
ImageName=#@#WeatherIcons\barometery.png
; Matrix handles rotation around center
TransformationMatrix=(Cos(Rad([MeasurePressureActualDeg])));(Sin(Rad([MeasurePressureActualDeg])));(-Sin(Rad([MeasurePressureActualDeg])));(Cos(Rad([MeasurePressureActualDeg])));(([MeterBaromAbs:X]+[MeterBaromAbs:W]/2)-(([MeterBaromAbs:X]+[MeterBaromAbs:W]/2)*Cos(Rad([MeasurePressureActualDeg])))+(([MeterBaromAbs:Y]+[MeterBaromAbs:H]/2)*Sin(Rad([MeasurePressureActualDeg]))));(([MeterBaromAbs:Y]+[MeterBaromAbs:H]/2)-(([MeterBaromAbs:X]+[MeterBaromAbs:W]/2)*Sin(Rad([MeasurePressureActualDeg])))-(([MeterBaromAbs:Y]+[MeterBaromAbs:H]/2)*Cos(Rad([MeasurePressureActualDeg]))))
ToolTipText=Pressure: [MeasurePressureInHg:2] inHg
DynamicVariables=1

; =================
; PRESSURE CHANGE (DELTA) — ImageRotate, degrees
; Needle art is drawn pointing straight up at 0°.
; Uses 3-hour tendency averaged to an hourly rate (inHg/hr).
;   0.00 inHg/hr  ->  0°  (steady)
;   +0.06 inHg/hr -> +90° (rising rapidly)
;   -0.06 inHg/hr -> -90° (falling rapidly)
; Clamp to +/-90° so 90° always means "rapid".
; =================

; Convert Lua export rate (hPa/hr) -> inHg/hr
[MeasurePressureTrendInHgPerHour]
Measure=Calc
Group=OMParse
UpdateDivider=-1
Formula=((#PressureRateHpaHr# + 0) * 0.0295299830714)
DynamicVariables=1

; Map rate -> degrees
[MeasurePressureTrendDeg]
Measure=Calc
Group=OMParse
Formula=Clamp(([MeasurePressureTrendInHgPerHour] / 0.06) * 90, -90, 90)
UpdateDivider=-1
DynamicVariables=1

; PRESSURE CHANGE needle (RIGHT) — rotates around image center automatically
; PRESSURE CHANGE needle (RIGHT) — now uses dynamic size + position
[MeterBaromTrend]
Meter=Image
Group=OM
X=(#DialStartX# + #DialSpacing#)
Y=#DialStartY#
W=#DialBaseSize#
H=#DialBaseSize#
ImageName=#@#WeatherIcons\barometer.png
TransformationMatrix=(Cos(Rad([MeasurePressureTrendDeg])));(Sin(Rad([MeasurePressureTrendDeg])));(-Sin(Rad([MeasurePressureTrendDeg])));(Cos(Rad([MeasurePressureTrendDeg])));(([MeterBaromTrend:X]+[MeterBaromTrend:W]/2)-(([MeterBaromTrend:X]+[MeterBaromTrend:W]/2)*Cos(Rad([MeasurePressureTrendDeg])))+(([MeterBaromTrend:Y]+[MeterBaromTrend:H]/2)*Sin(Rad([MeasurePressureTrendDeg]))));(([MeterBaromTrend:Y]+[MeterBaromTrend:H]/2)-(([MeterBaromTrend:X]+[MeterBaromTrend:W]/2)*Sin(Rad([MeasurePressureTrendDeg])))-(([MeterBaromTrend:Y]+[MeterBaromTrend:H]/2)*Cos(Rad([MeasurePressureTrendDeg]))))
ToolTipText=Delta: [MeasurePressureTrendInHgPerHour:3] inHg/hr
DynamicVariables=1

; =================
; HUMIDITY NEEDLE (ROTATE)
; Needle points straight up at 0°, rotates -135° to +135° for 0–100% RH
; =================

; Degrees for needle
[MeasureHumidityDeg]
Measure=Calc
Group=OMParse
UpdateDivider=-1
Formula=Clamp((([MeasureHumidity] / 100) * 270) - 135, -135, 135)
DynamicVariables=1

; Base size of the needle image
[MeasureHumidityBase]
Measure=Calc
Formula=60
DynamicVariables=1

; Absolute rotation in radians
[MeasureHumidityRad]
Measure=Calc
Formula=([MeasureHumidityDeg] * 0.01745329252)
DynamicVariables=1

; Scale factor to counteract diagonal shrink
[MeasureHumidityFactor]
Measure=Calc
Formula=(Abs(Cos([MeasureHumidityRad])) + Abs(Sin([MeasureHumidityRad])))
DynamicVariables=1

; Dynamic width/height to keep center fixed
[MeasureHumidityWH]
Measure=Calc
Formula=Round([MeasureHumidityBase] * [MeasureHumidityFactor])
DynamicVariables=1

; Fixed center coordinates for the dial
[MeasureHumidityCX]
Measure=Calc
Formula=([MeasureDialRowX] + 2*[MeasureDialSpacing] + ([MeasureHumidityBase]+8/2))
DynamicVariables=1

[MeasureHumidityCY]
Measure=Calc
Formula=[MeasureDialRowY] + ([MeasureHumidityBase]/2)
DynamicVariables=1

; Dynamic X/Y to keep center fixed
[MeasureHumidityX]
Measure=Calc
Formula=Round([MeasureHumidityCX] - ([MeasureHumidityWH]/2))
DynamicVariables=1

[MeasureHumidityY]
Measure=Calc
Formula=Round([MeasureHumidityCY] - ([MeasureHumidityWH]/2))
DynamicVariables=1

[MeasureHumidityLevel]
Measure=Calc
Formula=([MeasureHumidity] <= 20 ? 1 : ([MeasureHumidity] <= 40 ? 2 : ([MeasureHumidity] <= 60 ? 3 : ([MeasureHumidity] <= 80 ? 4 : 5))))
Substitute="1":"Severely Dry","2":"Dry","3":"Ideal","4":"Humid","5":"Excessive"
DynamicVariables=1
UpdateDivider=-1
Group=OM

[MeterHumidityBackground]
Meter=Image
Group=OM
UpdateDivider=-1
; W and H increased by 20% (1.2), so shift X and Y back by 10% (0.1)
X=(#DialStartX# + (#DialSpacing# * 2) + 8 - (#DialBaseSize# * 0.1))
Y=(#DialStartY# - (#DialBaseSize# * 0.1))
W=(#DialBaseSize# * 1.2)
H=(#DialBaseSize# * 1.2)
ImageName=#@#WeatherIcons\humidityBG.png
; Add this to prevent blurriness during scaling
AntiAlias=1
DynamicVariables=1

[MeterHumidity]
Meter=Image
Group=OM
UpdateDivider=-1
; The needle stays at the original BaseSize coordinates
X=(#DialStartX# + (#DialSpacing# * 2) + 8)
Y=#DialStartY#
W=#DialBaseSize#
H=#DialBaseSize#
ImageName=#@#WeatherIcons\HDial.png
; The matrix uses the needle's own center for rotation
TransformationMatrix=(Cos(Rad([MeasureHumidityDeg])));(Sin(Rad([MeasureHumidityDeg])));(-Sin(Rad([MeasureHumidityDeg])));(Cos(Rad([MeasureHumidityDeg])));(([MeterHumidity:X]+[MeterHumidity:W]/2)-(([MeterHumidity:X]+[MeterHumidity:W]/2)*Cos(Rad([MeasureHumidityDeg])))+(([MeterHumidity:Y]+[MeterHumidity:H]/2)*Sin(Rad([MeasureHumidityDeg]))));(([MeterHumidity:Y]+[MeterHumidity:H]/2)-(([MeterHumidity:X]+[MeterHumidity:W]/2)*Sin(Rad([MeasureHumidityDeg])))-(([MeterHumidity:Y]+[MeterHumidity:H]/2)*Cos(Rad([MeasureHumidityDeg]))))
ToolTipText=Humidity: [MeasureHumidity]%#CRLF#[MeasureHumidityLevel]
DynamicVariables=1

