[MeasureSunsetHour12]
Measure=Calc
Group=OMParse
UpdateDivider=-1
Formula=(( [MeasureSunsetHourNum] + 11 ) % 12) + 1
DynamicVariables=1

[MeasureSunsetIsPM]
