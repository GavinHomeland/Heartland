Measure=Calc
Group=OMParse
UpdateDivider=-1
Formula=Floor([MeasureSunsetHourNum] / 12)
DynamicVariables=1

[MeasureSunsetAmPm]
Measure=String
Group=OMParse
UpdateDivider=-1
String=[MeasureSunsetIsPM]
Substitute="1":"PM","0":"AM"
DynamicVariables=1

[MeasureSunsetFmt]
Measure=String
Group=OMParse
UpdateDivider=-1
String=[MeasureSunsetHour12]:[MeasureSunsetMin] [MeasureSunsetAmPm]
DynamicVariables=1

; =================
; METER — sunrise/sunset display
; =================
[MeterSun]
hidden=1
Meter=String
Group=OM
X=#Pad#
Y=630
Text=Sunrise: [MeasureSunriseFmt]   Sunset: [MeasureSunsetFmt]
FontFace=Segoe UI
FontSize=12
FontColor=255,255,255,255
AntiAlias=1
DynamicVariables=1

; =================================================
; ALERT ICON STACK — show flags (JSON-driven)
; =================================================

[MeasureWindGustRaw]
Measure=Plugin
Plugin=WebParser
Group=OMParse
UpdateDivider=-1
URL=[MeasureOM_File]
Download=0
RegExp=(?si)"current"\s*:\s*\{.*?"wind_gusts_10m"\s*:\s*(-?\d+(?:\.\d+)?)

[MeasureWindGustRaw_Index1]
Measure=WebParser
Group=OMParse
UpdateDivider=-1
URL=[MeasureWindGustRaw]
StringIndex=1

[MeasureWindGustMph]
Measure=Calc
Group=OMParse
UpdateDivider=-1
Formula=([MeasureWindGustRaw_Index1] + 0)
DynamicVariables=1

[MeasureShowSnowflake]
Measure=Calc
Group=OMParse
UpdateDivider=-1
Formula=([MeasureTempNumeric] <= 32)
DynamicVariables=1

[MeasureShowSnowman]
Measure=Calc
Group=OMParse
UpdateDivider=-1
Formula=([MeasureTempNumeric] <= 22)
DynamicVariables=1

[MeasureShowThermoCold]
Measure=Calc
Group=OMParse
UpdateDivider=-1
Formula=([MeasureTempNumeric] <= 0)
DynamicVariables=1

; Windsocks are based on sustained wind speed (mph)
[MeasureShowWindsockCalm]
Measure=Calc
Group=OMParse
UpdateDivider=-1
Formula=([MeasureWindSpeedMph] < 7)
DynamicVariables=1

[MeasureShowWindsockWeak]
Measure=Calc
Group=OMParse
UpdateDivider=-1
Formula=(( [MeasureWindSpeedMph] >= 7 ) && ( [MeasureWindSpeedMph] < 25 ))
DynamicVariables=1

[MeasureShowWindsockStrong]
Measure=Calc
Group=OMParse
UpdateDivider=-1
Formula=(( [MeasureWindSpeedMph] >= 25 ) && ( [MeasureWindSpeedMph] < 35 ))
DynamicVariables=1

[MeasureShowWindsockSCA]
Measure=Calc
Group=OMParse
UpdateDivider=-1
Formula=(( [MeasureWindSpeedMph] >= 35 ) && ( [MeasureWindSpeedMph] <= 45 ))
DynamicVariables=1

[MeasureShowWindsockGale]
Measure=Calc
Group=OMParse
UpdateDivider=-1
Formula=([MeasureWindSpeedMph] > 45)
DynamicVariables=1

[MeasureShowCoat]
Measure=Calc
Group=OMParse
UpdateDivider=-1
Formula=([MeasureFeelsF] < 50)
DynamicVariables=1

[MeasureShowTShirt]
Measure=Calc
Group=OMParse
UpdateDivider=-1
Formula=([MeasureFeelsF] >= 65)
DynamicVariables=1

[MeasureShowBeanie]
Measure=Calc
Group=OMParse
UpdateDivider=-1
Formula=([MeasureFeelsF] <= 32)
DynamicVariables=1

[MeasureShowHoodie]
Measure=Calc
Group=OMParse
UpdateDivider=-1
Formula=(([MeasureFeelsF] >= 50) && ([MeasureFeelsF] < 65))
DynamicVariables=1

[MeasureShowGlove]
Measure=Calc
Group=OMParse
UpdateDivider=-1
Formula=([MeasureFeelsF] <= 22)
DynamicVariables=1

[MeasureShowAvalanche]
Measure=Calc
Group=OMParse
UpdateDivider=-1
Formula=([MeasureFeelsF] <= 10)
DynamicVariables=1











