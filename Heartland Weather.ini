; =================
; IS_DAY / IS_NIGHT (from local time vs sunrise/sunset)
; =================
[MeasureSunriseMinutes]
Measure=Calc
Group=OMParse
UpdateDivider=-1
Formula=([MeasureSunriseHour]*60) + [MeasureSunriseMin]
DynamicVariables=1

[MeasureSunsetMinutes]
Measure=Calc
Group=OMParse
UpdateDivider=-1
Formula=([MeasureSunsetHour]*60) + ([MeasureSunsetMin]*60/60)
DynamicVariables=1

[MeasureIsDay]
Measure=Calc
Group=OMTick
UpdateDivider=60
Formula=(( [MeasureNowMinutes] >= [MeasureSunriseMinutes] ) * ( [MeasureNowMinutes] < [MeasureSunsetMinutes] ))
DynamicVariables=1

[MeasureIsNight]
Measure=Calc
Group=OMTick
UpdateDivider=60
Formula=1 - ([MeasureIsDay] + 0)
DynamicVariables=1

; =================
; PRESSURE GAUGE HELPERS (Lua)
; =================
[MeasurePressureGauges]
Measure=Script
Group=OMParse
ScriptFile=#@#Lua\PressureGauges.lua
UpdateDivider=-1
DynamicVariables=1

[MeasurePressureMedianInHg]
Measure=Calc
Group=OMParse
Formula=29.92
UpdateDivider=-1

[MeasurePressureActualDeg]
Measure=Calc
Group=OMParse
Formula=Clamp((([MeasurePressureInHg] - [MeasurePressureMedianInHg]) / 2.0) * 90, -90, 90)
DynamicVariables=1
UpdateDivider=-1

[MeasurePressureTrendInHgPerHour]
Measure=Calc
Group=OMParse
UpdateDivider=-1
Formula=((#PressureRateHpaHr# + 0) * 0.0295299830714)
DynamicVariables=1

[MeasurePressureTrendDeg]
Measure=Calc
Group=OMParse
Formula=Clamp(([MeasurePressureTrendInHgPerHour] / 0.06) * 90, -90, 90)
UpdateDivider=-1
DynamicVariables=1

; Barometer dynamic-size measures (counteract rotate shrink)
[MeasureDialRowX]
Measure=Calc
Formula=#DialRowX#
DynamicVariables=1
UpdateDivider=-1

[MeasureDialRowY]
Measure=Calc
Formula=#DialRowY#
DynamicVariables=1
UpdateDivider=-1

[MeasureDialSpacing]
Measure=Calc
Formula=#DialSpacing#
DynamicVariables=1
UpdateDivider=-1

[MeasureBaromBase]
Measure=Calc
Formula=60
DynamicVariables=1
UpdateDivider=-1

[MeasureBaromAbsRad]
Measure=Calc
Formula=([MeasurePressureActualDeg] * 0.01745329252)
DynamicVariables=1
UpdateDivider=-1

[MeasureBaromAbsFactor]
Measure=Calc
Formula=(Abs(Cos([MeasureBaromAbsRad])) + Abs(Sin([MeasureBaromAbsRad])))
DynamicVariables=1
UpdateDivider=-1

[MeasureBaromAbsWH]
Measure=Calc
Formula=Round([MeasureBaromBase] * [MeasureBaromAbsFactor])
DynamicVariables=1
UpdateDivider=-1

[MeasureBaromAbsCX]
Measure=Calc
Formula=([MeasureDialRowX] + ([MeasureBaromBase]/2))
DynamicVariables=1
UpdateDivider=-1

[MeasureBaromAbsCY]
Measure=Calc
Formula=[MeasureDialRowY] + ([MeasureBaromBase]/2)
DynamicVariables=1
UpdateDivider=-1

[MeasureBaromAbsX]
Measure=Calc
Formula=Round([MeasureBaromAbsCX] - ([MeasureBaromAbsWH] / 2))
DynamicVariables=1
UpdateDivider=-1

[MeasureBaromAbsY]
Measure=Calc
Formula=Round([MeasureBaromAbsCY] - ([MeasureBaromAbsWH] / 2))
DynamicVariables=1
UpdateDivider=-1

[MeasureBaromTrendRad]
Measure=Calc
Formula=([MeasurePressureTrendDeg] * 0.01745329252)
DynamicVariables=1
UpdateDivider=-1

[MeasureBaromTrendFactor]
Measure=Calc
Formula=(Abs(Cos([MeasureBaromTrendRad])) + Abs(Sin([MeasureBaromTrendRad])))
DynamicVariables=1
UpdateDivider=-1

[MeasureBaromTrendWH]
Measure=Calc
Formula=Round([MeasureBaromBase] * [MeasureBaromTrendFactor])
DynamicVariables=1
UpdateDivider=-1

[MeasureBaromTrendCX]
Measure=Calc
Formula=([MeasureDialRowX] + [MeasureDialSpacing] + ([MeasureBaromBase]/2))
DynamicVariables=1
UpdateDivider=-1

[MeasureBaromTrendCY]
Measure=Calc
Formula=[MeasureDialRowY] + ([MeasureBaromBase]/2)
DynamicVariables=1
UpdateDivider=-1

[MeasureBaromTrendX]
Measure=Calc
Formula=Round([MeasureBaromTrendCX] - ([MeasureBaromTrendWH] / 2))
DynamicVariables=1
UpdateDivider=-1

[MeasureBaromTrendY]
Measure=Calc
Formula=Round([MeasureBaromTrendCY] - ([MeasureBaromTrendWH] / 2))
DynamicVariables=1
UpdateDivider=-1

; =================
; HUMIDITY NEEDLE
; =================
[MeasureHumidityDeg]
Measure=Calc
Group=OMParse
UpdateDivider=-1
Formula=Clamp((([MeasureHumidity] / 100) * 270) - 135, -135, 135)
DynamicVariables=1

[MeasureHumidityBase]
Measure=Calc
Formula=60
DynamicVariables=1

[MeasureHumidityRad]
Measure=Calc
Formula=([MeasureHumidityDeg] * 0.01745329252)
DynamicVariables=1

[MeasureHumidityFactor]
Measure=Calc
Formula=(Abs(Cos([MeasureHumidityRad])) + Abs(Sin([MeasureHumidityRad])))
DynamicVariables=1

[MeasureHumidityWH]
Measure=Calc
Formula=Round([MeasureHumidityBase] * [MeasureHumidityFactor])
DynamicVariables=1

[MeasureHumidityCX]
Measure=Calc
Formula=([MeasureDialRowX] + 2*[MeasureDialSpacing] + ([MeasureHumidityBase]+8/2))
DynamicVariables=1

[MeasureHumidityCY]
Measure=Calc
Formula=[MeasureDialRowY] + ([MeasureHumidityBase]/2)
DynamicVariables=1

[MeasureHumidityX]
Measure=Calc
Formula=Round([MeasureHumidityCX] - ([MeasureHumidityWH]/2))
DynamicVariables=1

[MeasureHumidityY]
Measure=Calc
Formula=Round([MeasureHumidityCY] - ([MeasureHumidityWH]/2))
DynamicVariables=1

[MeasureHumidityLevel]
Measure=Calc
Formula=([MeasureHumidity] <= 20 ? 1 : ([MeasureHumidity] <= 40 ? 2 : ([MeasureHumidity] <= 60 ? 3 : ([MeasureHumidity] <= 80 ? 4 : 5))))
RegExpSubstitute=1
Substitute="^1$":"Very Dry","^2$":"Dry","^3$":"Ideal","^4$":"Humid","^5$":"Wet"
DynamicVariables=1
Group=OM | OMParse

; =================
; WIND ARROW — size/pulse animation
; =================
[MeasureWindSpeedMph]
Measure=Calc
Group=OMParse
UpdateDivider=-1
Formula=([MeasureWindSpeedRaw_Index1] + 0)
DynamicVariables=1

[MeasureWindArrowSide]
Measure=Calc
Group=OMParse
UpdateDivider=-1
Formula=Round(([MeasureWindSpeedMph] * 2) + 10)
DynamicVariables=1

[MeasureWindArrowPulse01]
Measure=Calc
UpdateDivider=1
Formula=(1 - cos((Counter / 8) * 2 * 3.141592653589793)) / 2
DynamicVariables=1

[MeasureWindArrowSidePulse]
Measure=Calc
UpdateDivider=1
Formula=Round(((([MeasureWindSpeedMph] * #WindArrowScaleFactor#) + #WindArrowBaseSize#) + (((((([MeasureWindGustMph] + [MeasureWindSpeedMph] + abs([MeasureWindGustMph] - [MeasureWindSpeedMph])) / 2) * #WindArrowScaleFactor#) + #WindArrowBaseSize#) - (([MeasureWindSpeedMph] * #WindArrowScaleFactor#) + #WindArrowBaseSize#)) * [MeasureWindArrowPulse01])) * #WindArrowGlobalScale#)
DynamicVariables=1

